<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pose Overlay</title>
<style>
:root{--glass:rgba(18,18,18,.58);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overscroll-behavior:none}
#app{position:fixed;inset:0;background:#000;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#guide{
 position:absolute;left:50%;top:50%;width:70%;max-width:95vw;max-height:85vh;
 transform:translate(-50%,-50%);transform-origin:center;
 opacity:.48;object-fit:contain;display:none;
 user-select:none;-webkit-user-drag:none;touch-action:none;
}
#guideMirror{position:absolute;inset:0;pointer-events:none;display:none}
#top{position:absolute;z-index:10;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center}
.cluster{display:flex;gap:9px}
.icon{
 width:45px;height:45px;border:1px solid var(--line);border-radius:50%;
 background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 color:#fff;font-size:20px;display:grid;place-items:center;
}
#hint{
 position:absolute;z-index:9;top:76px;left:50%;transform:translateX(-50%);
 background:rgba(0,0,0,.48);backdrop-filter:blur(10px);padding:8px 13px;
 border-radius:999px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .2s
}
#bottom{position:absolute;z-index:10;left:0;right:0;bottom:0;padding:10px 18px max(18px,env(safe-area-inset-bottom));}
#sliderBox{
 width:min(420px,100%);margin:0 auto 13px;padding:11px 15px 12px;border-radius:17px;
 background:rgba(10,10,10,.55);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
 display:none
}
.sliderHead{display:flex;justify-content:space-between;font-size:12px;color:#ddd;margin-bottom:7px}
input[type=range]{width:100%;height:28px;accent-color:#fff}
#actions{display:flex;align-items:center;justify-content:center;gap:22px}
.action{width:48px;height:48px;border:0;border-radius:50%;background:var(--glass);color:#fff;font-size:20px}
#capture{
 width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.12);
 padding:5px
}
#capture span{display:block;width:100%;height:100%;background:#fff;border-radius:50%}
#start{
 position:absolute;z-index:50;inset:0;background:#000;display:flex;align-items:center;justify-content:center;
 text-align:center;padding:30px
}
.startCard{width:min(370px,100%)}
.logo{width:70px;height:70px;border-radius:22px;background:#fff;color:#000;display:grid;place-items:center;margin:0 auto 22px;font-size:31px;font-weight:800}
h1{font-size:29px;letter-spacing:-.7px;margin:0 0 9px}
.sub{color:#a9a9a9;line-height:1.5;font-size:14px;margin:0 auto 23px;max-width:320px}
.primary{
 height:52px;border:0;border-radius:16px;padding:0 25px;background:#fff;color:#000;
 font-weight:750;font-size:15px
}
#permissionHelp{display:none;margin-top:14px;color:#aaa;font-size:12px;line-height:1.45}
#permissionHelp button{margin-top:9px;background:#222;border:1px solid #444;color:#fff;border-radius:11px;padding:9px 13px}
#picker{display:none}
#result{
 position:absolute;z-index:40;inset:0;background:#000;display:none;flex-direction:column;
 padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom))
}
#result img{width:100%;height:100%;object-fit:contain;min-height:0}
.resultBar{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px}
.title{font-size:15px;font-weight:700}
.textBtn{border:0;background:#222;color:#fff;padding:10px 14px;border-radius:12px}
#toast{
 position:absolute;z-index:80;left:50%;bottom:112px;transform:translateX(-50%) translateY(12px);
 background:#fff;color:#000;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:650;
 opacity:0;pointer-events:none;transition:.2s;white-space:nowrap
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#flash{position:absolute;inset:0;z-index:70;background:#fff;opacity:0;pointer-events:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <img id="guide" alt="Pose reference">
  <div id="top">
    <div class="cluster">
      <button class="icon" id="pickBtn" aria-label="Choose pose photo">＋</button>
      <button class="icon" id="removeBtn" aria-label="Remove pose" style="display:none">×</button>
    </div>
    <button class="icon" id="flipBtn" aria-label="Switch camera">↻</button>
  </div>

  <div id="hint">Drag the pose • Pinch to resize</div>

  <div id="bottom">
    <div id="sliderBox">
      <div class="sliderHead"><span>Pose opacity</span><b id="opacityText">48%</b></div>
      <input id="opacity" type="range" min="5" max="100" value="48">
    </div>
    <div id="actions">
      <button class="action" id="resetBtn" aria-label="Reset pose">⟳</button>
      <button id="capture" aria-label="Take photo"><span></span></button>
      <button class="action" id="mirrorBtn" aria-label="Mirror pose">⇋</button>
    </div>
  </div>

  <input id="picker" type="file" accept="image/*">

  <div id="start">
    <div class="startCard">
      <div class="logo">P</div>
      <h1>Pose Overlay</h1>
      <p class="sub">Put any pose photo over your live camera, lower the opacity, line yourself up, and take the shot.</p>
      <button class="primary" id="startBtn">Start Camera</button>
      <div id="permissionHelp">
        Camera access is blocked. Open your browser's site settings and allow Camera, then return here.
        <br><button id="retryBtn">Try again</button>
      </div>
    </div>
  </div>

  <div id="result">
    <div class="resultBar">
      <div class="title">Your photo</div>
      <div>
        <button class="textBtn" id="againBtn">Back</button>
        <button class="textBtn" id="saveBtn">Save</button>
      </div>
    </div>
    <img id="resultImg" alt="Captured photo">
  </div>

  <div id="toast"></div>
  <div id="flash"></div>
</div>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const video=$('video'), guide=$('guide'), picker=$('picker');
const start=$('start'), startBtn=$('startBtn'), permissionHelp=$('permissionHelp');
const sliderBox=$('sliderBox'), opacity=$('opacity'), opacityText=$('opacityText');
const removeBtn=$('removeBtn'), pickBtn=$('pickBtn'), flipBtn=$('flipBtn');
const resetBtn=$('resetBtn'), mirrorBtn=$('mirrorBtn'), capture=$('capture');
const result=$('result'), resultImg=$('resultImg'), saveBtn=$('saveBtn'), againBtn=$('againBtn');
const hint=$('hint'), toast=$('toast'), flash=$('flash');

let stream=null, facing='user', guideMirror=false;
let x=50,y=50,scale=1,rotation=0;
let activePointers=new Map(), startDistance=0, startScale=1, startX=50, startY=50;
let capturedBlob=null, toastTimer=null;

function notify(msg){
  toast.textContent=msg; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
}
function applyGuide(){
  guide.style.left=x+'%'; guide.style.top=y+'%';
  guide.style.transform=`translate(-50%,-50%) scale(${scale}) rotate(${rotation}deg)`;
  guide.style.opacity=Number(opacity.value)/100;
  guide.style.filter=guideMirror?'none':'none';
  guide.style.transform += guideMirror ? ' scaleX(-1)' : '';
}
function resetGuide(){x=50;y=50;scale=1;rotation=0;applyGuide();}
function showCamera(){start.classList.add('hidden');}
function stopCamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
}
async function openCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    permissionHelp.style.display='block';
    notify('Camera needs HTTPS and a supported browser.');
    return false;
  }
  try{
    stopCamera();
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:facing},
        width:{ideal:1920,min:640},
        height:{ideal:1080,min:480}
      },
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    permissionHelp.style.display='none';
    showCamera();
    return true;
  }catch(err){
    console.error(err);
    permissionHelp.style.display='block';
    start.classList.remove('hidden');
    if(err.name==='NotAllowedError' || err.name==='SecurityError'){
      notify('Allow camera access in your browser settings.');
    }else{
      notify('Could not start the camera.');
    }
    return false;
  }
}

startBtn.onclick=openCamera;
$('retryBtn').onclick=openCamera;

pickBtn.onclick=()=>picker.click();
picker.onchange=()=>{
  const file=picker.files && picker.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){notify('Please choose an image.');return;}
  const url=URL.createObjectURL(file);
  guide.onload=()=>{
    guide.style.display='block';
    sliderBox.style.display='block';
    removeBtn.style.display='grid';
    hint.style.opacity='1';
    setTimeout(()=>hint.style.opacity='0',2200);
    resetGuide();
  };
  guide.src=url;
};

removeBtn.onclick=()=>{
  guide.src='';guide.style.display='none';sliderBox.style.display='none';removeBtn.style.display='none';
  picker.value='';
};
opacity.oninput=()=>{opacityText.textContent=opacity.value+'%';applyGuide()};
resetBtn.onclick=resetGuide;
mirrorBtn.onclick=()=>{guideMirror=!guideMirror;applyGuide();notify(guideMirror?'Pose mirrored':'Pose normal')};

flipBtn.onclick=async()=>{
  facing=facing==='user'?'environment':'user';
  await openCamera();
};

function pointDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}

guide.addEventListener('pointerdown',e=>{
  guide.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId,e);
  if(activePointers.size===1){startX=x;startY=y;startScale=scale}
  if(activePointers.size===2){
    const pts=[...activePointers.values()];
    startDistance=pointDistance(pts[0],pts[1]);startScale=scale;
  }
});
guide.addEventListener('pointermove',e=>{
  if(!activePointers.has(e.pointerId))return;
  activePointers.set(e.pointerId,e);
  const pts=[...activePointers.values()];
  if(pts.length===1){
    const dx=(e.clientX-pts[0].clientX); // current event reference
    // Use incremental movement to keep drag stable.
    x += (e.movementX || 0)/innerWidth*100;
    y += (e.movementY || 0)/innerHeight*100;
    x=Math.max(5,Math.min(95,x));y=Math.max(5,Math.min(95,y));
    applyGuide();
  }else if(pts.length>=2){
    const d=pointDistance(pts[0],pts[1]);
    if(startDistance>0){
      scale=Math.max(.25,Math.min(4,startScale*d/startDistance));applyGuide();
    }
  }
});
function pointerEnd(e){activePointers.delete(e.pointerId);if(activePointers.size<2)startDistance=0}
guide.addEventListener('pointerup',pointerEnd);
guide.addEventListener('pointercancel',pointerEnd);

capture.onclick=()=>{
  if(!video.videoWidth){notify('Camera is not ready.');return;}
  const c=document.createElement('canvas');
  const vw=video.videoWidth,vh=video.videoHeight;
  c.width=vw;c.height=vh;
  const ctx=c.getContext('2d',{alpha:false});
  // Selfie camera output is mirrored to match what the user sees.
  if(facing==='user'){ctx.translate(vw,0);ctx.scale(-1,1);}
  ctx.drawImage(video,0,0,vw,vh);
  c.toBlob(blob=>{
    if(!blob)return;
    capturedBlob=blob;
    resultImg.src=URL.createObjectURL(blob);
    result.style.display='flex';
  },'image/jpeg',.94);
  flash.style.opacity='.9';setTimeout(()=>flash.style.opacity='0',80);
};

saveBtn.onclick=()=>{
  if(!capturedBlob)return;
  const url=URL.createObjectURL(capturedBlob);
  const a=document.createElement('a');
  a.href=url;a.download='pose-photo-'+Date.now()+'.jpg';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  notify('Photo saved.');
};
againBtn.onclick=()=>{
  result.style.display='none';
  if(resultImg.src){URL.revokeObjectURL(resultImg.src);resultImg.removeAttribute('src');}
};

window.addEventListener('beforeunload',stopCamera);

// If the browser already has camera permission, start without another prompt.
(async()=>{
  try{
    if(navigator.permissions){
      const p=await navigator.permissions.query({name:'camera'});
      if(p.state==='granted') await openCamera();
    }
  }catch(_){}
})();
})();
</script>
</body>
</html>
